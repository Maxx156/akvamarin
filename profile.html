    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<body>
    <div class="bubbles"></div>
    <header>
        <div class="logo">
            <i class="fas fa-water"></i> Аквамарин
        </div>
        <nav>

                <li><a href="index.html">Главная</a></li>

            </ul>
        </nav>
        <div class="auth-area">
            <span id="userGreeting" style="display: none;">
                Привет, <span id="userName"></span>
                <a href="profile.html" class="profile-link"><i class="fas fa-user-circle"></i></a>

            <button id="loginBtn" class="btn-primary"><i class="fas fa-user"></i> Вход / Регистрация</button>

        <div id="ticketsList" class="tickets-grid">

    <div id="authModal" class="modal">
    </div>

    <div id="customToast" class="toast"></div>
